name: Build PORT BOT PRO
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m py_compile port_bot.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PORT_BOT_PRO port_bot.py
      - uses: actions/upload-artifact@v4
        with:
          name: PORT_BOT_PRO-Windows
          path: dist/PORT_BOT_PRO.exe
          if-no-files-found: error
