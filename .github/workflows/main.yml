name: Build PORT BOT PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Check Python code
        run: |
          python -m py_compile port_bot.py

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PORT_BOT_PRO port_bot.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PORT_BOT_PRO-Windows
          path: dist/PORT_BOT_PRO.exe
          if-no-files-found: error
          retention-days: 30
